<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-blue-900 text-gray-800 font-sans flex items-center justify-center min-h-screen p-4">
    <div class="max-w-4xl w-full flex flex-col md:flex-row items-center justify-center gap-8">
        <!-- Admin Login Form -->
        <div class="w-full md:w-1/2 bg-white p-8 rounded-2xl shadow-xl">
            <div class="mb-6">
                <div class="bg-blue-600 text-white w-10 h-10 rounded-lg flex items-center justify-center mb-2">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-900">Administrator Login</h2>
                <p class="text-xs text-gray-500">Please enter your credentials.</p>
            </div>

            <form onsubmit="validateAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                    <input id="admin-email" type="email" placeholder="Enter your email" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                    <input id="admin-pass" type="password" placeholder="Enter your password" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">Login</button>
            </form>

            <div class="mt-4 pt-4 border-t text-center">
                <a href="student-login.html" class="text-xs text-blue-600 hover:underline">Back to Student Login</a>
            </div>
        </div>

        <!-- Right Side Info -->
        <div class="w-full md:w-1/2 text-white text-center md:text-left space-y-3">
            <div class="w-16 h-16 bg-blue-800 rounded-full flex items-center justify-center mx-auto md:mx-0 text-2xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-bold">Admin Panel</h2>
            <p class="text-xs text-blue-200">Manage job listings, student records, and application status.</p>
        </div>
    </div>

    <!-- Incorrect Credentials Pop-Up Modal -->
    <div id="error-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl">
            <div class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <h3 class="text-sm font-semibold text-gray-800 mb-4">Incorrect email or password.<br>Please try again.</h3>
            <button onclick="closeModal()" class="w-full bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 rounded-lg transition">OK</button>
        </div>
    </div>

    <script>
        function validateAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;

            if (email === "vshan279@gmail.com" && pass === "123456789") {
                window.location.href = "admin-dashboard.html";
            } else {
                document.getElementById('error-modal').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('error-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
