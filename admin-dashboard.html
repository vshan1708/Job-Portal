<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Job Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white border-r hidden md:block flex-shrink-0">
            <a href="admin-dashboard.html" class="p-6 border-b flex items-center space-x-2 hover:bg-gray-50 transition block">
                <i class="fa-solid fa-briefcase text-blue-600 text-xl"></i>
                <span class="font-bold text-gray-800 text-base">Job Portal Admin</span>
            </a>
            <nav class="p-4 space-y-1 text-sm font-medium text-gray-600">
                <a href="admin-dashboard.html" class="block px-4 py-2.5 rounded-lg bg-blue-50 text-blue-600 font-semibold"><i class="fa-solid fa-chart-line mr-2"></i> Dashboard</a>
                <a href="admin-manage-jobs.html" class="block px-4 py-2.5 rounded-lg hover:bg-gray-100"><i class="fa-solid fa-list-check mr-2"></i> Manage Jobs</a>
                <a href="admin-applications.html" class="block px-4 py-2.5 rounded-lg hover:bg-gray-100"><i class="fa-solid fa-file-lines mr-2"></i> Applications</a>
                <a href="student-job-status.html" class="block px-4 py-2.5 rounded-lg hover:bg-gray-100"><i class="fa-solid fa-user-graduate mr-2"></i> Student Records</a>
                
                <hr class="my-3 border-gray-200">
                <a href="student-login.html" class="block px-4 py-2.5 rounded-lg hover:bg-blue-50 text-blue-600 font-semibold"><i class="fa-solid fa-arrow-left-long mr-2"></i> Student Login</a>
                <a href="index.html" class="block px-4 py-2.5 rounded-lg text-red-600 hover:bg-red-50"><i class="fa-solid fa-right-from-bracket mr-2"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Dashboard Content -->
        <main class="flex-grow p-6 md:p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Dashboard</h1>

            <!-- Dynamic Metrics -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <p class="text-xs text-gray-500 font-medium">Total Registered Students</p>
                    <h2 id="total-students-cnt" class="text-2xl font-extrabold text-gray-800 mt-1">0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <p class="text-xs text-gray-500 font-medium">Total Jobs</p>
                    <h2 id="total-jobs-cnt" class="text-2xl font-extrabold text-gray-800 mt-1">0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <p class="text-xs text-gray-500 font-medium">Total Applications</p>
                    <h2 id="total-apps-cnt" class="text-2xl font-extrabold text-blue-600 mt-1">0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <p class="text-xs text-gray-500 font-medium">Pending Applications</p>
                    <h2 id="pending-apps-cnt" class="text-2xl font-extrabold text-yellow-600 mt-1">0</h2>
                </div>
            </div>

            <!-- Recent Applications Table -->
            <div class="bg-white rounded-xl border shadow-sm p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-800 text-lg">Recent Student Applications</h2>
                    <a href="admin-applications.html" class="text-xs text-blue-600 hover:underline font-semibold">Manage All Applications</a>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b bg-gray-50 text-gray-600 font-semibold">
                                <th class="p-3">Student Name</th>
                                <th class="p-3">Job Title</th>
                                <th class="p-3">Date</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="recent-apps-body" class="divide-y text-gray-700">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        function loadDashboardMetrics() {
            let students = JSON.parse(localStorage.getItem('portal_students')) || [
                { id: 1, name: 'Ali Rahman', matric: 'A12345', job: 'Cafe Assistant', appStatus: 'Accepted', jobStatus: 'Got Job', date: '14/10/2026' },
                { id: 2, name: 'Lim Wei Xuan', matric: 'A12346', job: 'Retail Assistant', appStatus: 'Accepted', jobStatus: 'Got Job', date: '14/10/2026' },
                { id: 3, name: 'Nur Aisyah', matric: 'A12347', job: 'Cashier', appStatus: 'Pending', jobStatus: 'Not Yet', date: '14/10/2026' }
            ];
            localStorage.setItem('portal_students', JSON.stringify(students));

            let jobs = JSON.parse(localStorage.getItem('portal_jobs')) || Array(20).fill({});

            // Filter students who have actually submitted a job application
            const actualApplications = students.filter(s => s.job && s.job !== 'None');
            const pendingApplications = actualApplications.filter(s => s.appStatus === 'Pending');

            // Update Counts Live
            document.getElementById('total-students-cnt').innerText = students.length;
            document.getElementById('total-jobs-cnt').innerText = jobs.length;
            document.getElementById('total-apps-cnt').innerText = actualApplications.length;
            document.getElementById('pending-apps-cnt').innerText = pendingApplications.length;

            // Render Recent Applications Table (Only actual job applications)
            const tbody = document.getElementById('recent-apps-body');
            tbody.innerHTML = '';

            if (actualApplications.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">No applications submitted yet.</td></tr>`;
                return;
            }

            actualApplications.forEach(app => {
                let badgeClass = app.appStatus === 'Accepted' ? 'bg-green-100 text-green-800' : (app.appStatus === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800');
                tbody.innerHTML += `
                    <tr>
                        <td class="p-3 font-semibold text-gray-900">${app.name}</td>
                        <td class="p-3">${app.job}</td>
                        <td class="p-3">${app.date || '15/10/2026'}</td>
                        <td class="p-3"><span class="${badgeClass} px-2.5 py-1 rounded font-semibold">${app.appStatus}</span></td>
                    </tr>
                `;
            });
        }

        window.onload = loadDashboardMetrics;
    </script>
</body>
</html>
