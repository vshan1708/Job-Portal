<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen justify-between">

    <!-- Navigation Header -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 font-bold text-xl text-gray-900">
                <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-briefcase"></i></div>
                <span>JobPortal</span>
            </a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
                <a href="jobs.html" class="text-gray-600 hover:text-blue-600">Jobs</a>
                <a href="my-applications.html" class="text-gray-600 hover:text-blue-600">My Applications</a>
                <a href="contact.html" class="text-gray-600 hover:text-blue-600">Contact</a>
                <a href="faq.html" class="text-gray-600 hover:text-blue-600">FAQ</a>
            </nav>
            <div class="flex items-center space-x-3 text-sm">
                <a href="admin-login.html" class="text-xs bg-gray-100 border text-gray-600 px-2.5 py-1.5 rounded-md hover:bg-gray-200">
                    <i class="fa-solid fa-user-shield mr-1"></i> Admin Login
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-md border my-8">
            <div class="text-center mb-6">
                <div class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-graduate text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Student Login</h2>
                <p class="text-xs text-gray-500 mt-1">Welcome back! Please login to your account.</p>
            </div>

            <form onsubmit="handleStudentLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Matric No</label>
                    <input id="student-matric" type="text" placeholder="Enter your matric number" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input id="student-pass" type="password" placeholder="Enter your password" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <i id="toggle-pass" onclick="togglePasswordVisibility()" class="fa-regular fa-eye absolute right-3 top-3 text-gray-400 cursor-pointer"></i>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition">Login</button>
            </form>

            <p class="text-xs text-center text-gray-500 mt-6">
                Don't have an account? <a href="student-register.html" class="text-blue-600 font-semibold hover:underline">Register</a>
            </p>
        </div>
    </main>

    <!-- Incorrect Password / Matric Pop-Up Modal -->
    <div id="error-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl transform transition-all">
            <div class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <h3 class="text-sm font-semibold text-gray-800 mb-4">Incorrect matric number or password.<br>Please try again.</h3>
            <button onclick="closeModal()" class="w-full bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 rounded-lg transition">OK</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        &copy; 2026 Student Part-Time Job Portal. All rights reserved.
    </footer>

    <script>
        function handleStudentLogin(e) {
            e.preventDefault();
            const matric = document.getElementById('student-matric').value.trim();
            const pass = document.getElementById('student-pass').value.trim();

            if (matric === "4252000211D" && pass === "060817100239") {
                window.location.href = "jobs.html";
            } else {
                document.getElementById('error-modal').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('error-modal').classList.add('hidden');
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('student-pass');
            const toggleIcon = document.getElementById('toggle-pass');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
