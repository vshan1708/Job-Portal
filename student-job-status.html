<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records - JobPortal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white border-r hidden md:block flex-shrink-0">
            <!-- Clickable Logo -> Admin Homepage -->
            <a href="admin-dashboard.html" class="p-6 border-b flex items-center space-x-2 hover:bg-gray-50 transition block" title="Go to Admin Homepage">
                <i class="fa-solid fa-briefcase text-blue-600 text-xl"></i>
                <span class="font-bold text-gray-800 text-base">JobPortal Admin</span>
            </a>
            <nav class="p-4 space-y-1 text-sm font-medium text-gray-600">
                <a href="admin-dashboard.html" class="block px-4 py-2.5 rounded-lg hover:bg-gray-100"><i class="fa-solid fa-chart-line mr-2"></i> Dashboard</a>
                <a href="admin-manage-jobs.html" class="block px-4 py-2.5 rounded-lg hover:bg-gray-100"><i class="fa-solid fa-list-check mr-2"></i> Manage Jobs</a>
                <a href="admin-applications.html" class="block px-4 py-2.5 rounded-lg hover:bg-gray-100"><i class="fa-solid fa-file-lines mr-2"></i> Applications</a>
                <a href="student-job-status.html" class="block px-4 py-2.5 rounded-lg bg-blue-50 text-blue-600 font-semibold"><i class="fa-solid fa-user-graduate mr-2"></i> Student Records</a>
                
                <hr class="my-3 border-gray-200">
                <!-- Direct Link Back to Student Login -->
                <a href="student-login.html" class="block px-4 py-2.5 rounded-lg hover:bg-blue-50 text-blue-600 font-semibold"><i class="fa-solid fa-arrow-left-long mr-2"></i> Student Login</a>
                <a href="student-login.html" class="block px-4 py-2.5 rounded-lg text-red-600 hover:bg-red-50"><i class="fa-solid fa-right-from-bracket mr-2"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow p-6 md:p-8">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Student Job Status</h1>
                    <p class="text-xs text-gray-500">View and track student records live across the portal.</p>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="bg-white p-4 rounded-xl border shadow-sm mb-6 flex justify-between items-center text-xs mt-4">
                <div class="font-semibold text-gray-600">Total Registered Students: <span id="student-count-badge" class="text-blue-600 font-bold">0</span></div>
                <button onclick="toggleModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition">
                    <i class="fa-solid fa-user-plus mr-1"></i> Add Student Record
                </button>
            </div>

            <!-- Student Table -->
            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b text-gray-600 font-semibold">
                            <th class="p-3">No.</th>
                            <th class="p-3">Student Name</th>
                            <th class="p-3">Matric No.</th>
                            <th class="p-3">Job Applied</th>
                            <th class="p-3">Application Status</th>
                            <th class="p-3">Job Status</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y text-gray-700">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal for Adding Student -->
    <div id="add-student-modal" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Add Student Record</h3>
            <form onsubmit="addStudent(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1">Student Name</label>
                    <input id="stu-name" type="text" placeholder="e.g. Varshan" required class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Matric Number</label>
                    <input id="stu-matric" type="text" placeholder="e.g. 4252000211D" required class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Job Applied</label>
                    <input id="stu-job" type="text" placeholder="e.g. Cashier" required class="w-full border rounded-lg p-2">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold mb-1">Application Status</label>
                        <select id="stu-app-status" class="w-full border rounded-lg p-2 bg-white">
                            <option value="Accepted">Accepted</option>
                            <option value="Pending">Pending</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Job Status</label>
                        <select id="stu-job-status" class="w-full border rounded-lg p-2 bg-white">
                            <option value="Got Job">Got Job</option>
                            <option value="Not Yet">Not Yet</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-2 pt-3">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border rounded-lg">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Save Student</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function getInitialStudents() {
            return [
                { id: 1, name: 'Ali Rahman', matric: 'A12345', job: 'Cafe Assistant', appStatus: 'Accepted', jobStatus: 'Got Job', date: '14/10/2026' },
                { id: 2, name: 'Lim Wei Xuan', matric: 'A12346', job: 'Retail Assistant', appStatus: 'Accepted', jobStatus: 'Got Job', date: '14/10/2026' },
                { id: 3, name: 'Nur Aisyah', matric: 'A12347', job: 'Cashier', appStatus: 'Pending', jobStatus: 'Not Yet', date: '14/10/2026' },
                { id: 4, name: 'Tan Jia Wen', matric: 'A12348', job: 'Cafe Assistant', appStatus: 'Rejected', jobStatus: 'Not Yet', date: '14/10/2026' },
                { id: 5, name: 'Varshan', matric: '4252000211D', job: 'Cashier', appStatus: 'Accepted', jobStatus: 'Not Yet', date: '14/10/2026' },
                { id: 6, name: 'Brunta', matric: '4253001621', job: 'Waiter', appStatus: 'Pending', jobStatus: 'Not Yet', date: '14/10/2026' }
            ];
        }

        function loadStudents() {
            let students = JSON.parse(localStorage.getItem('portal_students')) || getInitialStudents();
            localStorage.setItem('portal_students', JSON.stringify(students));

            document.getElementById('student-count-badge').innerText = students.length;

            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';
            students.forEach((stu, idx) => {
                let jobBadge = stu.jobStatus === 'Got Job' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-700';
                let appBadge = stu.appStatus === 'Accepted' ? 'text-green-600' : (stu.appStatus === 'Pending' ? 'text-yellow-600' : 'text-red-600');

                tbody.innerHTML += `
                    <tr>
                        <td class="p-3">${idx + 1}</td>
                        <td class="p-3 font-semibold text-gray-900">${stu.name}</td>
                        <td class="p-3">${stu.matric}</td>
                        <td class="p-3">${stu.job}</td>
                        <td class="p-3 font-medium ${appBadge}">${stu.appStatus}</td>
                        <td class="p-3"><span class="${jobBadge} px-2 py-0.5 rounded font-semibold">${stu.jobStatus}</span></td>
                        <td class="p-3"><button onclick="deleteStudent(${idx})" class="text-red-600 hover:underline"><i class="fa-solid fa-trash mr-1"></i>Remove</button></td>
                    </tr>
                `;
            });

            syncPortalApps(students);
        }

        function syncPortalApps(students) {
            let apps = students.map(s => ({
                id: s.id,
                student: s.name,
                job: s.job,
                date: s.date || '14/10/2026',
                status: s.appStatus
            }));
            localStorage.setItem('portal_apps', JSON.stringify(apps));
        }

        function deleteStudent(idx) {
            let students = JSON.parse(localStorage.getItem('portal_students'));
            students.splice(idx, 1);
            localStorage.setItem('portal_students', JSON.stringify(students));
            loadStudents();
        }

        function toggleModal(show) {
            document.getElementById('add-student-modal').classList.toggle('hidden', !show);
        }

        function addStudent(e) {
            e.preventDefault();
            let students = JSON.parse(localStorage.getItem('portal_students')) || getInitialStudents();
            const newStu = {
                id: Date.now(),
                name: document.getElementById('stu-name').value.trim(),
                matric: document.getElementById('stu-matric').value.trim(),
                job: document.getElementById('stu-job').value.trim(),
                appStatus: document.getElementById('stu-app-status').value,
                jobStatus: document.getElementById('stu-job-status').value,
                date: new Date().toLocaleDateString('en-GB')
            };
            students.push(newStu);
            localStorage.setItem('portal_students', JSON.stringify(students));
            toggleModal(false);
            loadStudents();
        }

        window.onload = loadStudents;
    </script>
</body>
</html>
