<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-center py-10">
    <div class="max-w-xl mx-auto w-full bg-white p-8 rounded-2xl border shadow-sm">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Job Application</h1>

        <form action="application-success.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name</label>
                <input type="text" placeholder="Enter your full name" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" placeholder="Enter your email address" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Available Working Day</label>
                <select required class="w-full border rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Select day</option>
                    <option>Weekdays (Mon - Fri)</option>
                    <option>Weekends (Sat - Sun)</option>
                    <option>Flexible / Any Day</option>
                </select>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
                <a href="job-details.html" class="px-5 py-2.5 border rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
