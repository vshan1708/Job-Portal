<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl border shadow-sm text-center">
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
            <i class="fa-solid fa-check"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Application Submitted Successfully!</h2>
        <p class="text-xs text-gray-500 mb-6">Your application has been submitted and sent to the administrator. You can check the live status in My Applications.</p>

        <div class="bg-gray-50 p-4 rounded-xl text-xs space-y-2 mb-6 border text-left">
            <div class="flex justify-between"><span class="text-gray-500">Job:</span> <span id="conf-job" class="font-bold text-gray-800">Cafe Assistant</span></div>
            <div class="flex justify-between"><span class="text-gray-500">Company:</span> <span id="conf-company" class="font-bold text-gray-800">ABC Cafe</span></div>
            <div class="flex justify-between"><span class="text-gray-500">Status:</span> <span class="px-2 py-0.5 rounded bg-yellow-100 text-yellow-800 font-semibold">Pending</span></div>
        </div>

        <a href="my-applications.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition">View My Applications</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('conf-job').innerText = urlParams.get('job') || 'Cafe Assistant';
        document.getElementById('conf-company').innerText = urlParams.get('company') || 'ABC Cafe';
    </script>
</body>
</html>
