<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Job Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 font-bold text-xl text-gray-900">
                <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-briefcase"></i></div>
                <span>Job Portal</span>
            </a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
                <a href="student-login.html" class="text-gray-600 hover:text-blue-600">Jobs</a>
                <a href="student-login.html" class="text-gray-600 hover:text-blue-600">My Applications</a>
                <a href="contact.html" class="text-gray-600 hover:text-blue-600">Contact</a>
                <a href="faq.html" class="text-gray-600 hover:text-blue-600">FAQ</a>
            </nav>
            <div class="flex items-center space-x-3 text-sm">
                <a href="index.html" class="text-gray-700 hover:text-blue-600 font-medium">Login</a>
            </div>
        </div>
    </header>

    <!-- Main Registration Box -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white p-8 rounded-2xl border shadow-sm my-6">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
                <p class="text-xs text-gray-500">Register to apply for student part-time jobs.</p>
            </div>

            <form onsubmit="handleRegistration(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Full Name</label>
                    <input id="reg-name" type="text" placeholder="e.g. John Doe" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Matric Number</label>
                    <input id="reg-matric" type="text" placeholder="e.g. 4252000299D" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Email Address</label>
                    <input id="reg-email" type="email" placeholder="student@university.edu.my" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Password</label>
                    <input id="reg-pass" type="password" placeholder="Create password" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-gray-700 mb-1">Confirm Password</label>
                    <input id="reg-confirm-pass" type="password" placeholder="Confirm password" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition mt-2">
                    Register Account
                </button>
            </form>

            <p class="text-xs text-center text-gray-500 mt-4">
                Already have an account? <a href="index.html" class="text-blue-600 font-semibold hover:underline">Log in here</a>
            </p>
        </div>
    </main>

    <!-- Global Footer -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500 mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>&copy; 2026 Job Portal. All rights reserved.</p>
            <a href="https://instagram.com/job_portal11?cplk=MW9iZ3ppYmg4ZTh5Mg%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-pink-600 flex items-center space-x-1.5 font-medium transition">
                <i class="fa-brands fa-instagram text-base text-pink-600"></i>
                <span>@job_portal11</span>
            </a>
        </div>
    </footer>

    <script>
        function handleRegistration(e) {
            e.preventDefault();

            const name = document.getElementById('reg-name').value.trim();
            const matric = document.getElementById('reg-matric').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const confirmPass = document.getElementById('reg-confirm-pass').value.trim();

            if (pass !== confirmPass) {
                alert("Passwords do not match. Please try again.");
                return;
            }

            let users = JSON.parse(localStorage.getItem('portal_users')) || [];

            if (users.some(u => u.matric === matric)) {
                alert("This Matric Number is already registered! Redirecting to login.");
                window.location.href = "index.html";
                return;
            }

            // Save user for login authentication
            users.push({ name, matric, email, pass });
            localStorage.setItem('portal_users', JSON.stringify(users));

            // Sync into student admin records
            let students = JSON.parse(localStorage.getItem('portal_students')) || [];
            students.push({
                id: Date.now(),
                name: name,
                matric: matric,
                job: 'None',
                appStatus: 'Pending',
                jobStatus: 'Not Yet',
                date: new Date().toLocaleDateString('en-GB')
            });
            localStorage.setItem('portal_students', JSON.stringify(students));

            alert("Registration successful! Please log in with your Matric Number.");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
