<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl border shadow-sm">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
            <p class="text-xs text-gray-500">Register to apply for student part-time jobs.</p>
        </div>

        <form onsubmit="handleRegistration(event)" class="space-y-3 text-xs">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Full Name</label>
                <input id="reg-name" type="text" placeholder="e.g. John Doe" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1">Matric Number</label>
                <input id="reg-matric" type="text" placeholder="e.g. 4252000299D" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1">Email Address</label>
                <input id="reg-email" type="email" placeholder="student@university.edu.my" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1">Password</label>
                <input id="reg-pass" type="password" placeholder="Create password" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1">Confirm Password</label>
                <input id="reg-confirm-pass" type="password" placeholder="Confirm password" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition mt-2">
                Register Account
            </button>
        </form>

        <p class="text-xs text-center text-gray-500 mt-4">
            Already have an account? <a href="index.html" class="text-blue-600 font-semibold hover:underline">Log in here</a>
        </p>
    </div>

    <script>
        function handleRegistration(e) {
            e.preventDefault();

            const name = document.getElementById('reg-name').value.trim();
            const matric = document.getElementById('reg-matric').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const confirmPass = document.getElementById('reg-confirm-pass').value.trim();

            if (pass !== confirmPass) {
                alert("Passwords do not match. Please check and try again.");
                return;
            }

            // Get registered users list
            let users = JSON.parse(localStorage.getItem('portal_users')) || [];

            // Check if student matric already registered
            if (users.some(u => u.matric === matric)) {
                alert("This Matric Number is already registered! Please log in.");
                window.location.href = "index.html";
                return;
            }

            // Save new user credentials
            users.push({ name, matric, email, pass });
            localStorage.setItem('portal_users', JSON.stringify(users));

            // Automatically add to admin student records table
            let students = JSON.parse(localStorage.getItem('portal_students')) || [];
            students.push({
                id: Date.now(),
                name: name,
                matric: matric,
                job: 'None',
                appStatus: 'Pending',
                jobStatus: 'Not Yet',
                date: new Date().toLocaleDateString('en-GB')
            });
            localStorage.setItem('portal_students', JSON.stringify(students));

            alert("Registration successful! You can now log in with your Matric Number.");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
