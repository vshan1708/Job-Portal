<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen justify-between">

    <!-- Navigation Header -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 font-bold text-xl text-gray-900">
                <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-briefcase"></i></div>
                <span>JobPortal</span>
            </a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
                <a href="jobs.html" class="text-gray-600 hover:text-blue-600">Jobs</a>
                <a href="my-applications.html" class="text-gray-600 hover:text-blue-600">My Applications</a>
                <a href="contact.html" class="text-gray-600 hover:text-blue-600">Contact</a>
                <a href="faq.html" class="text-gray-600 hover:text-blue-600">FAQ</a>
            </nav>
            <div class="flex items-center space-x-3 text-sm">
                <a href="admin-login.html" class="text-xs bg-gray-100 border text-gray-600 px-2.5 py-1.5 rounded-md hover:bg-gray-200">
                    <i class="fa-solid fa-user-shield mr-1"></i> Admin Login
                </a>
            </div>
        </div>
    </header>

    <!-- Registration Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-lg w-full bg-white p-8 rounded-2xl shadow-md border my-8">
            <div class="text-center mb-6">
                <div class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-plus text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Create Student Account</h2>
                <p class="text-xs text-gray-500 mt-1">Register to start applying for part-time jobs.</p>
            </div>

            <form onsubmit="handleRegistration(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name</label>
                    <input id="reg-fullname" type="text" placeholder="Enter your full name" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Matric No</label>
                        <input id="reg-matric" type="text" placeholder="e.g. 4252000211D" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Phone Number</label>
                        <input id="reg-phone" type="tel" placeholder="e.g. 0123456789" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                    <input id="reg-email" type="email" placeholder="student@university.edu.my" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                        <input id="reg-pass" type="password" placeholder="Create password" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Confirm Password</label>
                        <input id="reg-confirm-pass" type="password" placeholder="Confirm password" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div id="pass-error" class="text-xs text-red-500 hidden">Passwords do not match. Please try again.</div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">
                    Register Account
                </button>
            </form>

            <p class="text-xs text-center text-gray-500 mt-6">
                Already have an account? <a href="student-login.html" class="text-blue-600 font-semibold hover:underline">Login</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        &copy; 2026 Student Part-Time Job Portal. All rights reserved.
    </footer>

    <script>
        function handleRegistration(e) {
            e.preventDefault();
            const pass = document.getElementById('reg-pass').value;
            const confirmPass = document.getElementById('reg-confirm-pass').value;
            const errDiv = document.getElementById('pass-error');

            if (pass !== confirmPass) {
                errDiv.classList.remove('hidden');
                return;
            }

            errDiv.classList.add('hidden');
            alert("Account registered successfully! Please login with your Matric No.");
            window.location.href = "student-login.html";
        }
    </script>
</body>
</html>
