<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <header class="bg-white shadow-sm border-b sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 font-bold text-xl text-gray-900">
                <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-briefcase"></i></div>
                <span>JobPortal</span>
            </a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
                <a href="jobs.html" class="text-gray-600 hover:text-blue-600">Jobs</a>
                <a href="my-applications.html" class="text-blue-600 font-bold">My Applications</a>
                <a href="contact.html" class="text-gray-600 hover:text-blue-600">Contact</a>
                <a href="faq.html" class="text-gray-600 hover:text-blue-600">FAQ</a>
            </nav>
            <a href="student-login.html" class="text-sm text-gray-700 hover:text-blue-600">Logout</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Job Application History</h1>
        <p class="text-xs text-gray-500 mb-6">Track the real-time status of your submitted job applications.</p>

        <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600">
                        <th class="p-4">Job Title</th>
                        <th class="p-4">Company</th>
                        <th class="p-4">Date Applied</th>
                        <th class="p-4">Status</th>
                    </tr>
                </thead>
                <tbody id="my-apps-body" class="divide-y text-xs text-gray-700">
                </tbody>
            </table>
        </div>
    </main>

    <script>
        function loadMyApplications() {
            let students = JSON.parse(localStorage.getItem('portal_students')) || [
                { id: 1, name: 'Ali Rahman', matric: 'A12345', job: 'Cafe Assistant', company: 'ABC Cafe', appStatus: 'Accepted', date: '14/10/2026' },
                { id: 2, name: 'Lim Wei Xuan', matric: 'A12346', job: 'Retail Assistant', company: 'XYZ Store', appStatus: 'Accepted', date: '14/10/2026' },
                { id: 3, name: 'Nur Aisyah', matric: 'A12347', job: 'Cashier', company: 'Fresh Mart', appStatus: 'Pending', date: '14/10/2026' }
            ];

            const tbody = document.getElementById('my-apps-body');
            tbody.innerHTML = '';

            students.forEach(app => {
                let badgeClass = app.appStatus === 'Accepted' ? 'bg-green-100 text-green-800' : (app.appStatus === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800');
                tbody.innerHTML += `
                    <tr>
                        <td class="p-4 font-semibold text-gray-900">${app.job}</td>
                        <td class="p-4">${app.company || 'Partner Company'}</td>
                        <td class="p-4">${app.date || '15/10/2026'}</td>
                        <td class="p-4"><span class="${badgeClass} px-3 py-1 rounded-full font-semibold">${app.appStatus}</span></td>
                    </tr>
                `;
            });
        }

        window.onload = loadMyApplications;
    </script>
</body>
</html>
