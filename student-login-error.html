<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Error - JobPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-300 text-gray-800 font-sans flex items-center justify-center min-h-screen p-4 relative">
    <!-- Background Login Form (Blurred / Overlay backdrop) -->
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-md border opacity-50 pointer-events-none">
        <div class="text-center mb-6">
            <div class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-user-graduate text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Student Login</h2>
        </div>
    </div>

    <!-- Error Modal Pop-up (Slide 10) -->
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl">
            <div class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <h3 class="text-sm font-semibold text-gray-800 mb-4">Incorrect matric number or password.<br>Please try again.</h3>
            <a href="student-login.html" class="block w-full bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 rounded-lg transition">OK</a>
        </div>
    </div>
</body>
</html>
